name: CI

on:
  # push on every branch plus pull_request ran CI twice per PR commit
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The runner has no system 3.11 for `uv pip --system`; give uv its own venv instead
      - name: Install
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Unit tests (no GEE / DB)
        run: .venv/bin/pytest -q

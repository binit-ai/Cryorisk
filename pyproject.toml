[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryorisk"
version = "0.1.0"
description = "Glacier segmentation, hazard detection and surface velocity for the Khumbu region"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "earthengine-api>=1.0",
    "geemap>=0.35",
    "numpy>=1.26",
    "scipy>=1.12",
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Heavy extras: install only when a milestone needs them.
ml = [
    "torch>=2.3",
    "segmentation-models-pytorch>=0.3.4",
    "albumentations>=1.4",
    "rfdetr>=1.2",
    "supervision>=0.25",
    "pycocotools>=2.0.7",
]
label = ["napari[all]>=0.5"]
db = ["sqlalchemy>=2.0", "geoalchemy2>=0.15", "psycopg[binary]>=3.1"]
report = ["jinja2>=3.1", "matplotlib>=3.8", "folium>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cryorisk = "cryorisk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cryorisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gee: needs Earth Engine credentials (skipped by default in CI)",
    "db: needs a running PostGIS (docker compose up -d)",
]
addopts = "-m 'not gee and not db'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

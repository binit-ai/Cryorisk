    rgi_id: RGI2000-v7.0-G-15-06758
    split: train
  - name: Nuptse
    rgi_name: Nuptse Glacier
    rgi_id: RGI2000-v7.0-G-15-06755
    split: train
  - name: Changri Shar-Nup
    rgi_name: Changri Shar/Nup Gl
    rgi_id: RGI2000-v7.0-G-15-08295
    split: train
  - name: Bhote Kosi
    rgi_name: Bhote Kosi
    rgi_id: RGI2000-v7.0-G-15-08551
    split: train
  - name: Melung
    rgi_name: Melung
    rgi_id: RGI2000-v7.0-G-15-08547
    split: train
  # --- val ---
  - name: Imja-Lhotse Shar
    rgi_name: Imja/Lhotse Shar Gl.
    rgi_id: RGI2000-v7.0-G-15-06763
